name: Tube
options:
  bundleIdPrefix: com.nembx.tube
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

# 全局 build 设置
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # 让 sync_seed_rules.sh 能读 ../cezzu-rule/
    DANDANPLAY_APP_ID: ""
    DANDANPLAY_APP_SECRET: ""
    # Bangumi OAuth 应用凭证（可选）。留空时设置页只保留「粘贴 Access Token」登录。
    BANGUMI_CLIENT_ID: ""
    BANGUMI_CLIENT_SECRET: ""
    BANGUMI_REDIRECT_URI: "nembx-tube://bangumi-auth"

# SwiftPM 包依赖：本地 TubeKit
packages:
  TubeKit:
    path: TubeKit

# ============================================================
# Targets
# ============================================================
targets:

  # ---------- iOS App ----------
  Tube-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Base-iOS.xcconfig
      Release: Base-iOS.xcconfig
    sources:
      - path: Tube-iOS/Sources
    info:
      path: Tube-iOS/Info.plist
      properties:
        CFBundleDisplayName: Tube
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        DanDanPlayAppID: "$(DANDANPLAY_APP_ID)"
        DanDanPlayAppSecret: "$(DANDANPLAY_APP_SECRET)"
        BangumiClientID: "$(BANGUMI_CLIENT_ID)"
        BangumiClientSecret: "$(BANGUMI_CLIENT_SECRET)"
        BangumiRedirectURI: "$(BANGUMI_REDIRECT_URI)"
        # OAuth 回调走自定义 scheme，ASWebAuthenticationSession 靠它把授权码送回来。
        CFBundleURLTypes:
          - CFBundleURLName: com.nembx.tube.bangumi-auth
            CFBundleURLSchemes:
              - nembx-tube
    settings:
      base:
        PRODUCT_NAME: Tube
        PRODUCT_BUNDLE_IDENTIFIER: com.nembx.tube.iOS
        CODE_SIGN_ENTITLEMENTS: Tube-iOS/Tube_iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: TubeKit
        product: TubeKit
    preBuildScripts:
      - name: Sync seed rules from cezzu-rule/
        script: |
          "${SRCROOT}/scripts/sync_seed_rules.sh"
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false

  # ---------- macOS App ----------
  Tube-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Base-macOS.xcconfig
      Release: Base-macOS.xcconfig
    sources:
      - path: Tube-macOS/Sources
    info:
      path: Tube-macOS/Info.plist
      properties:
        CFBundleDisplayName: Tube
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 nembx. Based on Cezzu © bent2685. MIT License."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        DanDanPlayAppID: "$(DANDANPLAY_APP_ID)"
        DanDanPlayAppSecret: "$(DANDANPLAY_APP_SECRET)"
        BangumiClientID: "$(BANGUMI_CLIENT_ID)"
        BangumiClientSecret: "$(BANGUMI_CLIENT_SECRET)"
        BangumiRedirectURI: "$(BANGUMI_REDIRECT_URI)"
        CFBundleURLTypes:
          - CFBundleURLName: com.nembx.tube.bangumi-auth
            CFBundleURLSchemes:
              - nembx-tube
    settings:
      base:
        PRODUCT_NAME: Tube
        PRODUCT_BUNDLE_IDENTIFIER: com.nembx.tube.macOS
        CODE_SIGN_ENTITLEMENTS: Tube-macOS/Tube_macOS.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: TubeKit
        product: TubeKit
    preBuildScripts:
      - name: Sync seed rules from cezzu-rule/
        script: |
          "${SRCROOT}/scripts/sync_seed_rules.sh"
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false

# Schemes —— 默认就让两个 App target 各自有一个 scheme
schemes:
  Tube-iOS:
    build:
      targets:
        Tube-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  Tube-macOS:
    build:
      targets:
        Tube-macOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
