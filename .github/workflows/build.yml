name: Build

# 推 main / 打 v* tag / 手动触发时打包：
#   - iOS：未签名 IPA（安装前需自行签名）
#   - macOS：ad-hoc 签名的 Tube.app 封成 DMG（未公证）
# 打 tag 时额外发一条 GitHub Release 并附上两个产物。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 工程要求 Xcode 26+（Swift 6.2）。runner 上装了多个版本时挑最新的 26。
  XCODE_GLOB: /Applications/Xcode_26*.app

jobs:
  test:
    name: 单元测试
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: 选择 Xcode
        run: |
          XCODE=$(ls -d $XCODE_GLOB 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          # build.sh 会优先用 /Applications/Xcode.app，这里显式钉住选中的那份。
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: swift test
        run: bash scripts/build.sh test

  build:
    name: 打包 ${{ matrix.target }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        target: [ios, macos]
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          XCODE=$(ls -d $XCODE_GLOB 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          # build.sh 会优先用 /Applications/Xcode.app，这里显式钉住选中的那份。
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      # 凭证走仓库 Secrets，没配就留空：DanDanPlay 弹幕和 Bangumi OAuth 入口会不可用，
      # 其它功能不受影响。回调地址固定在 project.yml，不从这里传。
      - name: 写入本地凭证
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
          BANGUMI_CLIENT_ID: ${{ secrets.BANGUMI_CLIENT_ID }}
          BANGUMI_CLIENT_SECRET: ${{ secrets.BANGUMI_CLIENT_SECRET }}
        run: |
          cat > app/LocalSecrets.xcconfig <<EOF
          DANDANPLAY_APP_ID = ${DANDANPLAY_APP_ID}
          DANDANPLAY_APP_SECRET = ${DANDANPLAY_APP_SECRET}
          BANGUMI_CLIENT_ID = ${BANGUMI_CLIENT_ID}
          BANGUMI_CLIENT_SECRET = ${BANGUMI_CLIENT_SECRET}
          EOF

      - name: 读取版本号
        id: version
        run: |
          KEY=$([ "${{ matrix.target }}" = ios ] && echo ios || echo macos)
          VERSION=$(python3 -c "import json;print(json.load(open('version.json'))['$KEY']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 打 tag 发版时，tag 必须和 version.json 一致，否则 Release 会挂错版本号的包。
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "::error::tag v$TAG 与 version.json 的 $VERSION 不一致，请先执行 scripts/bump_version.sh $TAG" >&2
              exit 1
            fi
          fi

      # build 号用 run number：每次 CI 构建递增且不重复；本地构建仍用 version.json 里的值。
      - name: 构建
        env:
          BUILD_NUMBER_OVERRIDE: ${{ github.run_number }}
        run: bash scripts/build.sh ${{ matrix.target }}

      - name: 打包 IPA
        if: matrix.target == 'ios'
        run: |
          mkdir -p dist
          mv artifacts/Tube-ios-unsigned.ipa \
            "dist/Tube-${{ steps.version.outputs.version }}-ios-unsigned.ipa"

      - name: 打包 DMG
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist dmg-stage
          ditto artifacts/macos/Build/Products/Release/Tube.app dmg-stage/Tube.app
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Tube" -srcfolder dmg-stage -ov -format UDZO \
            "dist/Tube-${{ steps.version.outputs.version }}-macos.dmg"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Tube-${{ matrix.target }}-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 取 CHANGELOG.md 里与 tag 同版本的一节作为更新说明；找不到就退化为自动生成。
      - name: 生成更新说明
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          BODY=$(python3 - "$TAG" <<'PY'
          import re, sys
          tag = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # 匹配 `## [x.y.z]`，取到下一个 `## ` 之前
          pattern = re.compile(r"^## \[" + re.escape(tag) + r"\][^\n]*\n(.*?)(?=^## |\Z)", re.M | re.S)
          m = pattern.search(text)
          print(m.group(1).strip() if m else "")
          PY
          )
          {
            echo "## 更新内容"
            echo
            if [ -n "$BODY" ]; then echo "$BODY"; else echo "（本版本未填写更新日志，见下方提交记录。）"; fi
            echo
            echo "## 安装说明"
            echo
            echo '- `*-ios-unsigned.ipa`：未签名，安装前需自行签名（如 Sideloadly / AltStore / 自己的开发者证书）。'
            echo '- `*-macos.dmg`：本地 ad-hoc 签名、未公证。首次打开若被拦截，在「系统设置 → 隐私与安全性」里允许，或执行 `xattr -dr com.apple.quarantine /Applications/Tube.app`。'
          } > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
